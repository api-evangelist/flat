name: Flat
description: 'Flat (now operating as Clau) is a Mexican proptech real-estate marketplace
  and financial-services platform backed by 500 Global and Anthemis. Clau lets people
  buy and rent apartments and houses across major Mexican cities including Mexico City,
  Guadalajara, Monterrey, and Queretaro, and originates mortgage credit (Cofinavit,
  construction, land-purchase, and liquidity loans). It also offers property valuations,
  a price-map database, renovation services, and seller listing tools, alongside "El
  Living", its real-estate education blog. The company is consumer-facing and does
  not currently publish a public developer API; this profile was surfaced from the
  500 Global and Anthemis portfolios and enriched with domain-security and identity
  signals.'
